name: Nude Project Scraper

on:
  schedule:
    # Sun 6pm, Wed 6pm, Fri 6pm UTC
    - cron: '0 18 * * 0'
    - cron: '0 18 * * 3'
    - cron: '0 18 * * 5'
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Run in test mode (3 products only)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
      max_products:
        description: 'Maximum number of products to scrape'
        required: false
        type: number

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 720

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-0 libsm6 libxext6 libxrender-dev libgomp1

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Run scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          TEST_MODE="${{ github.event.inputs.test_mode }}"
          MAX_PRODS="${{ github.event.inputs.max_products }}"
          
          if [ "$TEST_MODE" = "true" ]; then
            echo "Running in TEST mode..."
            python test_scraper.py
          elif [ -n "$MAX_PRODS" ]; then
            echo "Running with max products: $MAX_PRODS"
            python -c "
import sys
sys.path.insert(0, '.')
from scraper_fast import get_urls, extract, CATEGORY_URLS, insert
import time

total = []
for cat_url, gender in CATEGORY_URLS:
    cat_name = cat_url.split('/collections/')[-1]
    print(f'Processing: {cat_name}')
    urls = get_urls(cat_url)
    print(f'Found {len(urls)} products')
    for url in urls[:int('$MAX_PRODS')]:
        p = extract(url)
        if p:
            p['gender'] = p['gender'] or gender
            total.append(p)
        time.sleep(0.1)
    print(f'Total: {len(total)}')
insert(total)
            "
          else
            echo "Running full scrape..."
            python scraper_fast.py

      - name: Report status
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ Scraper completed successfully"
          else
            echo "❌ Scraper failed. Check logs for details."
            exit 1