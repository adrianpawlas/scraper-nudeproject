name: Nude Project Scraper

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - test
          - scrape-only
  schedule:
    - cron: '0 18 * * 0,3,5'

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
      
      - name: Run scraper
        run: |
          if [ "${{ github.event.inputs.mode }}" = "test" ]; then
            python test_scraper.py
          elif [ "${{ github.event.inputs.mode }}" = "scrape-only" ]; then
            python -c "
import sys
sys.path.insert(0, '.')
from scraper_fast import get_urls, extract, CATEGORY_URLS, insert
import time

total = []
for cat_url, gender in CATEGORY_URLS:
    cat_name = cat_url.split('/collections/')[-1]
    print(f'Processing: {cat_name}')
    urls = get_urls(cat_url)
    print(f'Found {len(urls)} products')
    for url in urls[:200]:
        p = extract(url)
        if p:
            p['gender'] = p['gender'] or gender
            total.append(p)
        time.sleep(0.1)
    print(f'Total: {len(total)}')
insert(total)
            "
          else
            python scraper_fast.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      
      - name: Report status
        if: success()
        run: echo "Scraping completed successfully!"
      
      - name: Report failure
        if: failure()
        run: echo "Scraping failed!"